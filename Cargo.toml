[package]
name = "wips"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Keep work-in-progress agent sessions ready to resume"
license = "Apache-2.0"
repository = "https://git.julianfamily.org/joejulian/wips"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.6.4", features = ["derive"] }
directories = "6.0.0"
nix = { version = "0.31.3", features = ["term"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
toml = "0.9.8"
uuid = { version = "1.24.0", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.23.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
